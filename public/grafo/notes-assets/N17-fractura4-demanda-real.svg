<svg viewBox="0 0 680 620" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@300;400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap');
      text { font-family: "IBM Plex Sans", system-ui, sans-serif; }
      .title { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 17px; font-weight: 600; fill: #2B200F; letter-spacing: 0.02em; }
      .subtitle { font-size: 12px; fill: rgba(43,32,15,0.55); }
      .stat-value { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 36px; font-weight: 600; }
      .stat-label { font-size: 11px; fill: rgba(43,32,15,0.62); }
      .stat-unit { font-size: 11px; fill: rgba(43,32,15,0.45); }
      .section-title { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 13px; font-weight: 600; fill: #2B200F; letter-spacing: 0.03em; }
      .bar-label { font-size: 11px; fill: rgba(43,32,15,0.72); }
      .bar-value { font-family: "IBM Plex Mono", monospace; font-size: 11px; font-weight: 500; }
      .card-label { font-size: 11px; fill: rgba(43,32,15,0.55); }
      .card-value { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 24px; font-weight: 600; fill: #2B200F; }
      .card-detail { font-size: 10px; fill: rgba(43,32,15,0.45); }
      .ratio-value { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 42px; font-weight: 600; fill: #AC4952; }
      .ratio-label { font-size: 12px; fill: rgba(43,32,15,0.62); }
      .source { font-family: "IBM Plex Mono", monospace; font-size: 9px; fill: rgba(43,32,15,0.38); }
      .brand { font-family: "IBM Plex Sans Condensed", sans-serif; font-size: 9px; font-weight: 500; fill: rgba(43,32,15,0.28); letter-spacing: 0.08em; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="680" height="620" rx="15" fill="#FAF9F7"/>
  <rect x="0" y="0" width="680" height="4" rx="2" fill="#00A6AB"/>

  <!-- Header -->
  <text x="340" y="38" text-anchor="middle" class="title">FRACTURA 4: LA DEMANDA REAL</text>
  <text x="340" y="55" text-anchor="middle" class="subtitle">Lo que se invierte en IA vs. lo que genera</text>

  <!-- Divider -->
  <line x1="40" y1="68" x2="640" y2="68" stroke="rgba(43,32,15,0.10)" stroke-width="0.5"/>

  <!-- 3 stat cards -->
  <!-- Card 1 -->
  <rect x="40" y="82" width="190" height="88" rx="10" fill="#FFFFFF" stroke="rgba(43,32,15,0.07)" stroke-width="0.5"/>
  <text x="135" y="108" text-anchor="middle" class="stat-label">Empresas sin impacto</text>
  <text x="135" y="146" text-anchor="middle" class="stat-value" fill="#AC4952">90%</text>
  <text x="135" y="162" text-anchor="middle" class="stat-unit">no reportan mejora</text>

  <!-- Card 2 -->
  <rect x="245" y="82" width="190" height="88" rx="10" fill="#FFFFFF" stroke="rgba(43,32,15,0.07)" stroke-width="0.5"/>
  <text x="340" y="108" text-anchor="middle" class="stat-label">Usuarios que pagan</text>
  <text x="340" y="146" text-anchor="middle" class="stat-value" fill="#335E82">3%</text>
  <text x="340" y="162" text-anchor="middle" class="stat-unit">del total</text>

  <!-- Card 3 -->
  <rect x="450" y="82" width="190" height="88" rx="10" fill="#FFFFFF" stroke="rgba(43,32,15,0.07)" stroke-width="0.5"/>
  <text x="545" y="108" text-anchor="middle" class="stat-label">Proyectos abandonados</text>
  <text x="545" y="146" text-anchor="middle" class="stat-value" fill="#2B200F">30%</text>
  <text x="545" y="162" text-anchor="middle" class="stat-unit">tras prueba de concepto</text>

  <!-- Gap section -->
  <text x="40" y="206" class="section-title">AI REVENUE GAP — SEQUOIA CAPITAL, 2024</text>

  <!-- Bar: Gasto -->
  <text x="40" y="228" class="bar-label">Gasto en infraestructura IA (capex + opex)</text>
  <text x="640" y="228" text-anchor="end" class="bar-value" fill="rgba(43,32,15,0.72)">$600.000M</text>
  <rect x="40" y="234" width="600" height="28" rx="5" fill="#EAF2F2"/>
  <rect x="40" y="234" width="600" height="28" rx="5" fill="#AC4952"/>
  <text x="52" y="253" class="bar-value" fill="#FFFFFF">$600.000M</text>

  <!-- Bar: Ingresos -->
  <text x="40" y="284" class="bar-label">Ingresos reales generados por IA</text>
  <text x="640" y="284" text-anchor="end" class="bar-value" fill="rgba(43,32,15,0.72)">$100.000M</text>
  <rect x="40" y="290" width="600" height="28" rx="5" fill="#EAF2F2"/>
  <rect x="40" y="290" width="100" height="28" rx="5" fill="#00A6AB"/>
  <text x="52" y="309" class="bar-value" fill="#FFFFFF">$100.000M</text>

  <!-- Gap annotation -->
  <line x1="142" y1="320" x2="142" y2="335" stroke="rgba(43,32,15,0.17)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="640" y1="264" x2="640" y2="335" stroke="rgba(43,32,15,0.17)" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="142" y1="335" x2="640" y2="335" stroke="rgba(43,32,15,0.17)" stroke-width="0.5"/>
  <text x="391" y="350" text-anchor="middle" class="bar-label" style="font-style: italic;">gap: $500.000M</text>

  <!-- Divider -->
  <line x1="40" y1="370" x2="640" y2="370" stroke="rgba(43,32,15,0.10)" stroke-width="0.5"/>

  <!-- OpenAI cards -->
  <rect x="40" y="385" width="290" height="80" rx="10" fill="#FFFFFF" stroke="rgba(43,32,15,0.07)" stroke-width="0.5"/>
  <text x="55" y="407" class="card-label">OpenAI: compromisos a 8 anos</text>
  <text x="55" y="436" class="card-value">$1,4 billones</text>
  <text x="55" y="453" class="card-detail">1.400.000.000.000 dolares</text>

  <rect x="350" y="385" width="290" height="80" rx="10" fill="#FFFFFF" stroke="rgba(43,32,15,0.07)" stroke-width="0.5"/>
  <text x="365" y="407" class="card-label">OpenAI: ingresos anuales</text>
  <text x="365" y="436" class="card-value">$25.000M</text>
  <text x="365" y="453" class="card-detail">dos ordenes de magnitud menos</text>

  <!-- Ratio box -->
  <rect x="40" y="485" width="600" height="85" rx="10" fill="#F8EEEE"/>
  <text x="340" y="512" text-anchor="middle" class="ratio-label">Por cada dolar que la IA genera, se invierten</text>
  <text x="340" y="552" text-anchor="middle" class="ratio-value">$6 — $10</text>

  <!-- Sources -->
  <text x="40" y="598" class="source">Fuentes: NBER 2026 | McKinsey 2024 | Gartner 2024 | Sequoia Capital 2024 | Bloomberg/OpenAI 2025</text>
  <text x="640" y="598" text-anchor="end" class="brand">KOI SAMSA</text>
</svg>