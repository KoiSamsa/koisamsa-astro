<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N01.a1 · Han Stack · v0.2 · Koi Samsa</title>
<!-- Página anfitriona (grafo v1.44): hace de /lab. En la web, este fragmento vive dentro de un bloque de WordPress y es
     el tema quien pone el papel, el margen y la letra; aquí lo pone esta página, con MUDA inyectado (regla del Lab,
     27-jun). Lo que va dentro de <body> es el artefacto tal cual está en el Vault: no se ha tocado. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<base target="_blank">
<style>
:root{--ks-font-sans:"Albert Sans",system-ui,sans-serif;--ks-font-serif:"Newsreader",Georgia,serif;--ks-font-mono:"Fira Code",ui-monospace,monospace;color-scheme:light}
html,body{margin:0;background:#FAF9F7;color:#2B200F}
body{padding:24px;font-family:var(--ks-font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-synthesis:none}
@media (max-width:640px){body{padding:16px}}
</style>
</head>
<body>
<div class="ks-scope ks-lab-han">
  <section class="ks-art ks-han">
    <header class="ks-art-head ks-han-head">
      <div class="ks-han-meta">KOI SAMSA LAB · ARTEFACT</div>
      <h1 class="ks-han-title">Han Stack · v0.2</h1>
      <p class="ks-han-subtitle">
        Conceptos de Byung-Chul Han traducidos a interacción digital e infraestructura técnica
      </p>
    </header>

    <div class="ks-art-body ks-han-layout">
      <div class="ks-han-canvas">
        <div class="ks-han-column ks-han-tech" id="ksHanTech"></div>

        <div class="ks-han-spine" id="ksHanSpine"></div>

        <div class="ks-han-column ks-han-infra" id="ksHanInfra"></div>
      </div>

      <aside class="ks-art-panel ks-han-panel">
        <div class="ks-han-panel-label">CONCEPTO ACTIVO</div>
        <h2 class="ks-han-panel-title" id="ksHanPanelTitle">—</h2>
        <p class="ks-han-panel-description" id="ksHanPanelDescription"></p>

        <div class="ks-han-panel-block">
          <h3 class="ks-han-panel-subtitle">Conceptos relacionados</h3>
          <div class="ks-han-related" id="ksHanPanelRelated"></div>
        </div>
      </aside>
    </div>

    <footer class="ks-art-foot ks-han-foot">
      v0.2 · Traducción sociotécnica de conceptos de Byung-Chul Han
    </footer>
  </section>

  <style>
    .ks-scope.ks-lab-han,
    .ks-scope.ks-lab-han *,
    .ks-scope.ks-lab-han *::before,
    .ks-scope.ks-lab-han *::after {
      box-sizing: border-box;
    }

    .ks-scope.ks-lab-han button,
    .ks-scope.ks-lab-han input,
    .ks-scope.ks-lab-han select,
    .ks-scope.ks-lab-han textarea {
      font: inherit;
      letter-spacing: inherit;
      color: inherit;
    }

    .ks-scope.ks-lab-han {
      --ks-bg: #f6f3ee;
      --ks-surface: #fbfaf7;
      --ks-surface-2: #f3efe8;
      --ks-border: #ddd6ca;
      --ks-border-strong: #b8c9d6;
      --ks-text: #2b2723;
      --ks-muted: #7a746c;
      --ks-accent: #5c84a2;
      --ks-radius-xl: 24px;
      --ks-radius-lg: 18px;
      --ks-radius-md: 14px;
      --ks-shadow: 0 1px 2px rgba(0,0,0,.03);
      color: var(--ks-text);
      width: 100%;
      margin: 0;
    }

    .ks-scope.ks-lab-han .ks-art {
      width: 100%;
      background: var(--ks-surface);
      border: 1px solid var(--ks-border);
      border-radius: var(--ks-radius-xl);
      padding: 32px;
      box-shadow: var(--ks-shadow);
    }

    .ks-scope.ks-lab-han .ks-han-head {
      margin-bottom: 28px;
    }

    .ks-scope.ks-lab-han .ks-han-meta {
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ks-muted);
      margin-bottom: 16px;
      font-weight: 600;
    }

    .ks-scope.ks-lab-han .ks-han-title {
      margin: 0 0 10px;
      font-size: clamp(38px, 5vw, 64px);
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-weight: 500;
    }

    .ks-scope.ks-lab-han .ks-han-subtitle {
      margin: 0;
      max-width: 920px;
      font-size: 16px;
      line-height: 1.55;
      color: var(--ks-muted);
    }

    .ks-scope.ks-lab-han .ks-han-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(300px, 380px);
      gap: 28px;
      align-items: start;
      margin-top: 28px;
    }

    .ks-scope.ks-lab-han .ks-han-canvas {
      min-width: 0;
      display: grid;
      grid-template-columns: minmax(180px, 1fr) minmax(220px, 300px) minmax(180px, 1fr);
      gap: 20px;
      align-items: start;
      padding: 12px 0;
    }

    .ks-scope.ks-lab-han .ks-han-column,
    .ks-scope.ks-lab-han .ks-han-spine {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .ks-scope.ks-lab-han .ks-han-row {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 10px;
    }

    .ks-scope.ks-lab-han .ks-han-chip-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: flex-start;
    }

    .ks-scope.ks-lab-han .ks-han-chip-group.is-right {
      align-items: flex-end;
    }

    .ks-scope.ks-lab-han .ks-han-chip {
      display: inline-flex;
      align-items: center;
      min-height: 38px;
      padding: 8px 14px;
      border: 1px solid #e7e1d8;
      border-radius: 999px;
      background: #fff;
      color: var(--ks-text);
      font-size: 15px;
      line-height: 1.25;
      box-shadow: var(--ks-shadow);
      white-space: normal;
    }

    .ks-scope.ks-lab-han .ks-han-spine {
      position: relative;
    }

    .ks-scope.ks-lab-han .ks-han-spine::before {
      content: "";
      position: absolute;
      top: 30px;
      bottom: 30px;
      left: 50%;
      width: 1px;
      transform: translateX(-50%);
      background: linear-gradient(
        to bottom,
        transparent 0%,
        #d8e1e8 8%,
        #d8e1e8 92%,
        transparent 100%
      );
      z-index: 0;
    }

    .ks-scope.ks-lab-han .ks-han-node-wrap {
      position: relative;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
    }

    .ks-scope.ks-lab-han .ks-han-node {
      position: relative;
      width: 100%;
      min-height: 92px;
      padding: 18px 20px;
      border-radius: var(--ks-radius-lg);
      border: 1px solid #dde3e7;
      background: #fff;
      color: var(--ks-text);
      font-size: 18px;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      transition: border-color .18s ease, box-shadow .18s ease, transform .18s ease;
      box-shadow: var(--ks-shadow);
    }

    .ks-scope.ks-lab-han .ks-han-node:hover {
      transform: translateY(-1px);
      border-color: #cbd8e1;
    }

    .ks-scope.ks-lab-han .ks-han-node.is-active {
      border-color: var(--ks-border-strong);
      box-shadow: 0 0 0 1px rgba(92,132,162,.08), var(--ks-shadow);
      background: #fbfdff;
    }

    .ks-scope.ks-lab-han .ks-han-node-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: var(--ks-accent);
      margin: 0 auto 12px;
      box-shadow: 0 0 0 4px rgba(92,132,162,.09);
    }

    .ks-scope.ks-lab-han .ks-han-panel {
      background: var(--ks-surface);
      border: 1px solid var(--ks-border);
      border-radius: var(--ks-radius-lg);
      padding: 22px;
      min-height: 420px;
    }

    .ks-scope.ks-lab-han .ks-han-panel-label {
      font-size: 11px;
      line-height: 1.3;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--ks-muted);
      font-weight: 600;
      margin-bottom: 14px;
    }

    .ks-scope.ks-lab-han .ks-han-panel-title {
      margin: 0 0 14px;
      font-size: 28px;
      line-height: 1.15;
      letter-spacing: -0.02em;
      font-weight: 600;
    }

    .ks-scope.ks-lab-han .ks-han-panel-description {
      margin: 0;
      font-size: 16px;
      line-height: 1.65;
      color: var(--ks-text);
    }

    .ks-scope.ks-lab-han .ks-han-panel-block {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--ks-border);
    }

    .ks-scope.ks-lab-han .ks-han-panel-subtitle {
      margin: 0 0 12px;
      font-size: 14px;
      line-height: 1.4;
      font-weight: 600;
      color: var(--ks-muted);
    }

    .ks-scope.ks-lab-han .ks-han-related {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .ks-scope.ks-lab-han .ks-han-related-btn {
      appearance: none;
      border: 1px solid #e5ded4;
      background: #fff;
      color: var(--ks-text);
      border-radius: 999px;
      padding: 8px 12px;
      font-size: 14px;
      line-height: 1.2;
      cursor: pointer;
      transition: border-color .18s ease, transform .18s ease;
    }

    .ks-scope.ks-lab-han .ks-han-related-btn:hover {
      transform: translateY(-1px);
      border-color: #cfc4b3;
    }

    .ks-scope.ks-lab-han .ks-han-foot {
      margin-top: 28px;
      padding-top: 18px;
      border-top: 1px solid var(--ks-border);
      font-size: 14px;
      line-height: 1.4;
      color: var(--ks-muted);
    }

    @media (max-width: 1100px) {
      .ks-scope.ks-lab-han .ks-han-layout {
        grid-template-columns: 1fr;
      }

      .ks-scope.ks-lab-han .ks-han-panel {
        min-height: auto;
      }
    }

    @media (max-width: 820px) {
      .ks-scope.ks-lab-han .ks-art {
        padding: 22px;
      }

      .ks-scope.ks-lab-han .ks-han-canvas {
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .ks-scope.ks-lab-han .ks-han-spine::before {
        display: none;
      }

      .ks-scope.ks-lab-han .ks-han-chip-group,
      .ks-scope.ks-lab-han .ks-han-chip-group.is-right {
        align-items: flex-start;
      }

      .ks-scope.ks-lab-han .ks-han-row,
      .ks-scope.ks-lab-han .ks-han-node-wrap {
        min-height: auto;
      }
    }
  </style>

  <script>
    (function () {
      const hanData = [
        {
          id: "performance",
          title: "Sociedad de rendimiento",
          description:
            "Han describe una sociedad en la que la disciplina externa desaparece y es sustituida por la autoexigencia permanente. El individuo se convierte en gestor de sí mismo y debe optimizar continuamente su rendimiento, su productividad y su visibilidad.",
          tech: ["KPIs", "Dashboards", "Optimización continua"],
          infra: ["Software empresarial", "Cómputo distribuido", "Plataformas SaaS"],
          related: ["Psicopolítica", "Cansancio"]
        },
        {
          id: "psychopolitics",
          title: "Psicopolítica",
          description:
            "La gestión contemporánea del comportamiento ya no opera solo por prohibición o disciplina. Se apoya en datos, diseño de interfaces, recomendación algorítmica y sistemas capaces de modular la conducta desde dentro.",
          tech: ["Algoritmos de recomendación", "Perfilado conductual", "Interfaces persuasivas"],
          infra: ["Pipelines de datos", "Servidores de procesamiento", "Infraestructura de tracking"],
          related: ["Sociedad de rendimiento", "Infocracia", "No-cosas"]
        },
        {
          id: "fatigue",
          title: "Cansancio",
          description:
            "El cansancio no es solo un estado psicológico individual. En el entorno digital aparece como saturación, hiperestimulación y exigencia de disponibilidad constante, sostenidas por sistemas técnicos siempre activos.",
          tech: ["Burnout digital", "Saturación informativa", "Notificaciones constantes"],
          infra: ["Consumo energético", "Refrigeración de centros de datos", "Desgaste de hardware"],
          related: ["Sociedad de rendimiento", "Psicopolítica", "Hipercomunicación"]
        }
      ];

      const techRoot = document.getElementById("ksHanTech");
      const spineRoot = document.getElementById("ksHanSpine");
      const infraRoot = document.getElementById("ksHanInfra");

      const panelTitle = document.getElementById("ksHanPanelTitle");
      const panelDescription = document.getElementById("ksHanPanelDescription");
      const panelRelated = document.getElementById("ksHanPanelRelated");

      let activeId = hanData[0].id;

      function getItemById(id) {
        return hanData.find(item => item.id === id);
      }

      function getItemByTitle(title) {
        return hanData.find(item => item.title === title);
      }

      function createChip(label, alignRight) {
        const chip = document.createElement("div");
        chip.className = "ks-han-chip";
        chip.textContent = label;
        if (alignRight) chip.style.textAlign = "right";
        return chip;
      }

      function renderTech(id) {
        const active = getItemById(id);
        techRoot.innerHTML = "";

        hanData.forEach(item => {
          const row = document.createElement("div");
          row.className = "ks-han-row";

          const group = document.createElement("div");
          group.className = "ks-han-chip-group";

          if (item.id === active.id) {
            item.tech.forEach(label => group.appendChild(createChip(label, false)));
          }

          row.appendChild(group);
          techRoot.appendChild(row);
        });
      }

      function renderInfra(id) {
        const active = getItemById(id);
        infraRoot.innerHTML = "";

        hanData.forEach(item => {
          const row = document.createElement("div");
          row.className = "ks-han-row";

          const group = document.createElement("div");
          group.className = "ks-han-chip-group is-right";

          if (item.id === active.id) {
            item.infra.forEach(label => group.appendChild(createChip(label, true)));
          }

          row.appendChild(group);
          infraRoot.appendChild(row);
        });
      }

      function renderSpine(id) {
        spineRoot.innerHTML = "";

        hanData.forEach(item => {
          const wrap = document.createElement("div");
          wrap.className = "ks-han-node-wrap";

          const button = document.createElement("button");
          button.className = "ks-han-node" + (item.id === id ? " is-active" : "");
          button.setAttribute("type", "button");
          button.setAttribute("aria-pressed", item.id === id ? "true" : "false");
          button.dataset.id = item.id;

          const dot = document.createElement("div");
          dot.className = "ks-han-node-dot";

          const label = document.createElement("div");
          label.textContent = item.title;

          button.appendChild(dot);
          button.appendChild(label);

          button.addEventListener("click", function () {
            activeId = item.id;
            renderAll();
          });

          wrap.appendChild(button);
          spineRoot.appendChild(wrap);
        });
      }

      function renderPanel(id) {
        const active = getItemById(id);
        panelTitle.textContent = active.title;
        panelDescription.textContent = active.description;
        panelRelated.innerHTML = "";

        active.related.forEach(label => {
          const relatedButton = document.createElement("button");
          relatedButton.type = "button";
          relatedButton.className = "ks-han-related-btn";
          relatedButton.textContent = label;

          relatedButton.addEventListener("click", function () {
            const relatedItem = getItemByTitle(label);
            if (!relatedItem) return;
            activeId = relatedItem.id;
            renderAll();
          });

          panelRelated.appendChild(relatedButton);
        });
      }

      function renderAll() {
        renderTech(activeId);
        renderSpine(activeId);
        renderInfra(activeId);
        renderPanel(activeId);
      }

      renderAll();
    })();
  </script>
</div>
</body>
</html>
