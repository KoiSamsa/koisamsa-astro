<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>N19.a2 · Rare Earths · v0.1 · Koi Samsa</title>
<!-- Página anfitriona (grafo v1.44): hace de /lab. En la web, este fragmento vive dentro de un bloque de WordPress y es
     el tema quien pone el papel, el margen y la letra; aquí lo pone esta página, con MUDA inyectado (regla del Lab,
     27-jun). Lo que va dentro de <body> es el artefacto tal cual está en el Vault: no se ha tocado. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<base target="_blank">
<style>
:root{--ks-font-sans:"Albert Sans",system-ui,sans-serif;--ks-font-serif:"Newsreader",Georgia,serif;--ks-font-mono:"Fira Code",ui-monospace,monospace;color-scheme:light}
html,body{margin:0;background:#FAF9F7;color:#2B200F}
body{padding:24px;font-family:var(--ks-font-sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-synthesis:none}
@media (max-width:640px){body{padding:16px}}
</style>
</head>
<body>
<section class="ks-lab-pt">
  <div class="ks-pt-wrap">
    <header class="ks-pt-head">
      <div>
        <h2 class="ks-pt-title">Rare Earths · v0.1</h2>
        <p class="ks-pt-sub">Hover o click para ver ficha · Tab para navegar</p>
      </div>
      <div class="ks-pt-legend" aria-label="Leyenda">
        <span class="ks-dot ks-dot--ree"></span><span class="ks-pt-legend-txt">Tierras raras</span>
        <span class="ks-dot ks-dot--critical"></span><span class="ks-pt-legend-txt">Crítico</span>
      </div>
    </header>

    <div class="ks-pt-grid" role="grid" aria-label="Tabla · Tierras raras">
      <!-- Sc, Y (a menudo se agrupan con REE) -->
      <button class="ks-el ks-el--aux" role="gridcell" data-symbol="Sc" data-name="Scandium" data-z="21" data-group="Aux" data-note="A menudo se agrupa con REE por propiedades y cadenas de suministro."
        aria-label="Sc, Scandium, Z 21">
        <span class="ks-z">21</span>
        <span class="ks-sym">Sc</span>
        <span class="ks-name">Scandium</span>
      </button>

      <button class="ks-el ks-el--aux" role="gridcell" data-symbol="Y" data-name="Yttrium" data-z="39" data-group="Aux" data-note="Suele considerarse REE por ocurrencia y uso industrial."
        aria-label="Y, Yttrium, Z 39">
        <span class="ks-z">39</span>
        <span class="ks-sym">Y</span>
        <span class="ks-name">Yttrium</span>
      </button>

      <!-- Lanthanides -->
      <button class="ks-el ks-el--ree ks-el--critical" role="gridcell" data-symbol="Nd" data-name="Neodymium" data-z="60" data-group="Lanthanide" data-note="Imanes permanentes (motores, eólica). Alta criticidad por demanda y sustitución limitada."
        aria-label="Nd, Neodymium, Z 60">
        <span class="ks-z">60</span><span class="ks-sym">Nd</span><span class="ks-name">Neodymium</span>
      </button>

      <button class="ks-el ks-el--ree ks-el--critical" role="gridcell" data-symbol="Dy" data-name="Dysprosium" data-z="66" data-group="Lanthanide" data-note="Refuerza imanes a alta temperatura. Cuello de botella típico en REE."
        aria-label="Dy, Dysprosium, Z 66">
        <span class="ks-z">66</span><span class="ks-sym">Dy</span><span class="ks-name">Dysprosium</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="La" data-name="Lanthanum" data-z="57" data-group="Lanthanide" data-note="Catalizadores, óptica. Más abundante dentro del grupo."
        aria-label="La, Lanthanum, Z 57">
        <span class="ks-z">57</span><span class="ks-sym">La</span><span class="ks-name">Lanthanum</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="Ce" data-name="Cerium" data-z="58" data-group="Lanthanide" data-note="Pulido, catalizadores, vidrio. Alto volumen relativo."
        aria-label="Ce, Cerium, Z 58">
        <span class="ks-z">58</span><span class="ks-sym">Ce</span><span class="ks-name">Cerium</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="Pr" data-name="Praseodymium" data-z="59" data-group="Lanthanide" data-note="Imanes, aleaciones. Suele ir con Nd en aplicaciones."
        aria-label="Pr, Praseodymium, Z 59">
        <span class="ks-z">59</span><span class="ks-sym">Pr</span><span class="ks-name">Praseodymium</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="Sm" data-name="Samarium" data-z="62" data-group="Lanthanide" data-note="Imanes SmCo, nuclear. Segmento específico, alto valor técnico."
        aria-label="Sm, Samarium, Z 62">
        <span class="ks-z">62</span><span class="ks-sym">Sm</span><span class="ks-name">Samarium</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="Eu" data-name="Europium" data-z="63" data-group="Lanthanide" data-note="Fósforos (pantallas/iluminación). Riesgo por concentración de supply."
        aria-label="Eu, Europium, Z 63">
        <span class="ks-z">63</span><span class="ks-sym">Eu</span><span class="ks-name">Europium</span>
      </button>

      <button class="ks-el ks-el--ree" role="gridcell" data-symbol="Tb" data-name="Terbium" data-z="65" data-group="Lanthanide" data-note="Fósforos y aleaciones. Suele considerarse crítico."
        aria-label="Tb, Terbium, Z 65">
        <span class="ks-z">65</span><span class="ks-sym">Tb</span><span class="ks-name">Terbium</span>
      </button>
    </div>

    <!-- Panel / ficha -->
    <aside class="ks-pt-panel" aria-live="polite" aria-label="Ficha del elemento">
      <div class="ks-pt-card">
        <div class="ks-pt-card-top">
          <div>
            <div class="ks-pt-kicker">Elemento</div>
            <div class="ks-pt-hline">
              <span class="ks-pt-symbol" id="ksPtSymbol">—</span>
              <span class="ks-pt-z" id="ksPtZ">Z —</span>
            </div>
            <div class="ks-pt-name" id="ksPtName">Pasa el cursor o toca un bloque</div>
          </div>
          <button class="ks-pt-clear" type="button" id="ksPtClear" aria-label="Limpiar ficha">×</button>
        </div>

        <dl class="ks-pt-meta">
          <div><dt>Grupo</dt><dd id="ksPtGroup">—</dd></div>
          <div><dt>Nota</dt><dd id="ksPtNote">—</dd></div>
        </dl>

        <p class="ks-pt-foot">Tip: click fija la ficha · hover es temporal</p>
      </div>
    </aside>
  </div>
</section>

<style>
  /* ====== KS Lab Periodic Table v0.1 ====== */
  .ks-lab-pt{
    padding: clamp(24px, 4vw, 56px) 0;
  }
  .ks-pt-wrap{
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 18px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }
  .ks-pt-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap: 16px;
    border-bottom: 1px solid rgba(0,0,0,.08);
    padding-bottom: 14px;
  }
  .ks-pt-title{
    margin:0;
    font-size: 18px;
    letter-spacing: .02em;
  }
  .ks-pt-sub{
    margin:6px 0 0;
    font-size: 13px;
    opacity: .7;
  }
  .ks-pt-legend{
    display:flex;
    align-items:center;
    gap: 8px;
    font-size: 12px;
    opacity:.8;
    flex-wrap:wrap;
    justify-content:flex-end;
  }
  .ks-dot{
    width: 10px;
    height: 10px;
    border-radius: 999px;
    display:inline-block;
    border: 1px solid rgba(0,0,0,.15);
  }
  .ks-dot--ree{ background: rgba(0,0,0,.06); }
  .ks-dot--critical{ background: rgba(0,0,0,.18); }

  .ks-pt-grid{
    display:grid;
    grid-template-columns: repeat(6, minmax(120px, 1fr));
    gap: 12px;
  }

  .ks-el{
    appearance:none;
    border: 1px solid rgba(0,0,0,.12);
    background: rgba(255,255,255,.70);
    border-radius: 14px;
    padding: 12px 12px 10px;
    text-align:left;
    cursor:pointer;
    transition: transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
    position: relative;
  }
  .ks-el:hover,
  .ks-el:focus{
    transform: translateY(-1px);
    box-shadow: 0 8px 24px rgba(0,0,0,.08);
    border-color: rgba(0,0,0,.18);
    outline: none;
  }
  .ks-el:focus-visible{
    outline: 2px solid rgba(0,0,0,.35);
    outline-offset: 2px;
  }

  .ks-z{
    font-size: 12px;
    opacity: .65;
  }
  .ks-sym{
    display:block;
    font-size: 26px;
    font-weight: 700;
    letter-spacing: .01em;
    margin-top: 6px;
  }
  .ks-name{
    display:block;
    font-size: 12px;
    opacity: .8;
    margin-top: 6px;
  }

  .ks-el--ree{
    background: rgba(0,0,0,.03);
  }
  .ks-el--critical{
    border-color: rgba(0,0,0,.22);
    background: rgba(0,0,0,.06);
  }
  .ks-el--aux{
    background: rgba(255,255,255,.55);
  }

  .ks-pt-panel{
    position: relative;
  }
  .ks-pt-card{
    border: 1px solid rgba(0,0,0,.10);
    background: rgba(255,255,255,.78);
    border-radius: 16px;
    padding: 16px;
  }
  .ks-pt-card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap: 12px;
  }
  .ks-pt-kicker{
    font-size: 12px;
    opacity: .65;
    letter-spacing: .02em;
  }
  .ks-pt-hline{
    display:flex;
    align-items:baseline;
    gap: 10px;
    margin-top: 6px;
  }
  .ks-pt-symbol{
    font-size: 34px;
    font-weight: 750;
  }
  .ks-pt-z{
    font-size: 12px;
    opacity: .7;
  }
  .ks-pt-name{
    font-size: 14px;
    margin-top: 8px;
    opacity: .9;
  }
  .ks-pt-clear{
    border: 1px solid rgba(0,0,0,.12);
    background: transparent;
    border-radius: 999px;
    width: 34px;
    height: 34px;
    cursor: pointer;
    font-size: 18px;
    line-height: 1;
    opacity: .7;
  }
  .ks-pt-clear:hover{ opacity: 1; }

  .ks-pt-meta{
    margin: 14px 0 0;
    display:grid;
    gap: 10px;
  }
  .ks-pt-meta div{
    display:grid;
    grid-template-columns: 90px 1fr;
    gap: 10px;
    align-items:baseline;
  }
  .ks-pt-meta dt{
    font-size: 12px;
    opacity:.6;
  }
  .ks-pt-meta dd{
    margin:0;
    font-size: 13px;
    opacity:.9;
  }
  .ks-pt-foot{
    margin: 14px 0 0;
    font-size: 12px;
    opacity: .55;
  }

  /* Responsive */
  @media (max-width: 980px){
    .ks-pt-grid{ grid-template-columns: repeat(3, minmax(120px, 1fr)); }
  }
  @media (max-width: 640px){
    .ks-pt-grid{ grid-template-columns: repeat(2, minmax(120px, 1fr)); }
    .ks-pt-head{ align-items:flex-start; }
  }
</style>

<script>
  (function(){
    const root = document.querySelector('.ks-lab-pt');
    if(!root) return;

    const symbolEl = root.querySelector('#ksPtSymbol');
    const zEl      = root.querySelector('#ksPtZ');
    const nameEl   = root.querySelector('#ksPtName');
    const groupEl  = root.querySelector('#ksPtGroup');
    const noteEl   = root.querySelector('#ksPtNote');
    const clearBtn = root.querySelector('#ksPtClear');

    let pinned = false;

    function setCard(btn){
      const { symbol, name, z, group, note } = btn.dataset;
      symbolEl.textContent = symbol || '—';
      zEl.textContent      = z ? `Z ${z}` : 'Z —';
      nameEl.textContent   = name || '—';
      groupEl.textContent  = group || '—';
      noteEl.textContent   = note || '—';
    }

    function clearCard(){
      pinned = false;
      symbolEl.textContent = '—';
      zEl.textContent      = 'Z —';
      nameEl.textContent   = 'Pasa el cursor o toca un bloque';
      groupEl.textContent  = '—';
      noteEl.textContent   = '—';
    }

    root.querySelectorAll('.ks-el').forEach(btn => {
      btn.addEventListener('mouseenter', () => { if(!pinned) setCard(btn); });
      btn.addEventListener('focus',      () => { if(!pinned) setCard(btn); });

      btn.addEventListener('click', () => {
        pinned = true;
        setCard(btn);
      });
    });

    clearBtn.addEventListener('click', clearCard);

    // Escape para "desanclar"
    document.addEventListener('keydown', (e) => {
      if(e.key === 'Escape') clearCard();
    });
  })();
</script>
</body>
</html>
